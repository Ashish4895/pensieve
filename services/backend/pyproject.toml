[project]
name = "pensieve-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "celery>=5.5.0",
    "django==6.1.1",
    "django-cors-headers>=4.9.0",
    "djangorestframework>=3.16.1",
    "djangorestframework-simplejwt>=5.5.1",
    "drf-spectacular>=0.29.0",
    "google-genai==2.22.0",
    "gunicorn==26.2.0",
    "openai==3.8.0",
    "orjson>=3.11.7",
    "pgvector==0.5.0",
    "psycopg[binary]==3.3.5",
    "python-dotenv==1.2.3",
    "redis>=5.0.0",
    "uvicorn>=0.41.0",
    "whitenoise==6.11.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-django==4.14.0",
]
