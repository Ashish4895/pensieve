# Render Blueprint — monorepo (SPA+API web, Celery worker, Postgres, Redis)
# https://render.com/docs/blueprint-spec
databases:
  - name: pensieve-db
    plan: free
    postgresMajorVersion: "16"

services:
  - type: keyvalue
    name: pensieve-redis
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: []

  - type: web
    name: pensieve
    runtime: docker
    plan: free
    autoDeploy: true
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/docs/
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CHAT_RATE_LIMIT
        value: "30"
      - key: GEMINI_API_KEY
        sync: false
      - key: PENSIVE_BOOTSTRAP_EMAIL
        sync: false
      - key: PENSIVE_BOOTSTRAP_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: pensieve-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: pensieve-redis
          property: connectionString

  - type: worker
    name: pensieve-worker
    runtime: docker
    plan: free
    autoDeploy: true
    dockerfilePath: ./docker/celery/Dockerfile
    dockerContext: .
    envVars:
      - key: CELERY_ROLE
        value: worker
      - key: DJANGO_SECRET_KEY
        fromService:
          type: web
          name: pensieve
          envVarKey: DJANGO_SECRET_KEY
      - key: DEBUG
        value: "false"
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: pensieve-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: pensieve-redis
          property: connectionString
