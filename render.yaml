# Render Blueprint — https://render.com/docs/blueprint-spec
databases:
  - name: pensieve-db
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: pensieve
    runtime: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CHAT_RATE_LIMIT
        value: "30"
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: pensieve-db
          property: connectionString
