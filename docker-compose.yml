name: pensieve

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: pensieve
      POSTGRES_USER: pensieve
      POSTGRES_PASSWORD: pensieve
    ports:
      - "5433:5432"
    volumes:
      - pensieve_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pensieve -d pensieve"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://pensieve:pensieve@db:5432/pensieve
      PORT: "8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pensieve_pgdata:
